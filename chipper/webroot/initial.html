<!DOCTYPE html>
<html>

<head>
    
  <title>Wire-Pod盒服初始设置</title>
  <!-- Meta Apple tags for a PWA like experience. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#1e1e1e">
  <link rel="stylesheet" type="text/css" href="css/style.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://kit.fontawesome.com/7508f396ac.js" crossorigin="anonymous"></script>
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="Thu, 01 Jan 1970 00:00:00 GMT">
</head>

<body>
  <div id="outer">
    <div id="content" class="">
      <h1>Wire-Pod盒服初始设置</h1>
      <hr />
      <div id="setup-status"></div>
      <div id="config-options" style="display: block">
        <p>
          欢迎来到Wire-Pod本地盒服！这是设置的最后一步。根据您的喜好配置这些选项，然后点击底部的“提交设置”按钮来完成最后的设置
        </p>
        <hr />
        <div id="section-conn" style="display: block">
          <h3>连接选项</h3>
          <hr class="small-hr">
          <div class="center" id="connStatus"></div>
          <select onchange="checkConn()" name="connSelection" id="connSelection">
            <option value="ep">
              逃生舱（推荐用于常规机器人）
            </option>
            <option value="ip">
              IP 地址（推荐用于 OSKR/dev-unlocked 机器人）
            </option>
          </select>
          <div class="center" id="portViz" style="display: none">
            <label for="portInput">在此输入自定义端口（默认为 443）</label>
            <input type="text" id="portInput" name="portInput" placeholder="443" />
          </div>
          <hr />
        </div>

        <div id="section-language" style="display: none">
          <h3>语音转文字语言</h3>
          <hr class="small-hr">
          <div class="center" id="languageStatus"></div>
          <div id="languageSelectionDiv">
            <select name="languageSelection" id="languageSelection">
              <option value="zh-CN">中文（中国）</option>
              <option value="en-US">English (US)</option>
              <option value="it-IT">Italian (IT)</option>
              <option value="es-ES">Spanish (ES)</option>
              <option value="fr-FR">French (FR)</option>
              <option value="de-DE">German (DE)</option>
              <option value="pt-BR">Portuguese (BR)</option>
              <option value="pl-PL">Polish (PL)</option>
              <option value="tr-TR">Turkish (TR)</option>
              <option value="ru-RU">Russian (RU)</option>
              <option value="nt-NL">Dutch (NL)</option>
              <option value="uk-UA">Ukrainian (UA)</option>
              <option value="vi-VN">VietNamese (VN)</option>
            </select>
          </div>
          <hr />
        </div>

        <small class="desc">设置好Wire-Pod盒服，就可以在服务器设置页面配置天气和知识图谱设置。</small>
        <hr />

        <button onclick="sendSetupInfo()">
          提交设置
        </button>
      </div>
    </div>
  </div>
</body>
<script src="./js/ui.js"></script>
<script src="./js/main.js"></script>
<script src="./js/initial.js"></script>
<!-- <script src="./sdkapp/js/main.js"></script> -->
<script>
  checkLanguage();
</script>

</html>
